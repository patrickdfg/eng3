<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6c5ce7"><title>WordStep 학생 영어</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="app">
<header><div><small>오늘도 한 걸음</small><h1>WordStep</h1></div><button id="soundToggle" aria-label="자동 발음" aria-pressed="false">🔈</button></header>
<main>
<section id="homeView" class="view active"><article class="hero"><div><small>나의 학습</small><h2><b id="learnedCount">0</b>개 단어를 익혔어요</h2></div><div class="ring" id="ring"><span id="percent">0%</span></div></article><div class="stats"><div><b id="streak">1</b><small>연속 학습일</small></div><div><b id="favorites">0</b><small>즐겨찾기</small></div><div><b id="wrongs">0</b><small>복습 단어</small></div></div><article class="daily"><div><em>오늘의 추천</em><h2>필수 단어 10개</h2><p>카드 → 예문 → 퀴즈 순서로 공부해요.</p></div><button class="primary" id="dailyStart">학습 시작</button></article><h2 class="title">빠른 학습</h2><div class="actions"><button data-study="all">📚<b>전체 단어</b><small id="totalCount"></small></button><button data-study="favorite">⭐<b>즐겨찾기</b><small>저장한 단어</small></button><button data-study="wrong">🔁<b>오답 복습</b><small>틀린 단어</small></button><button data-go="quiz">🎯<b>퀴즈</b><small>10문제</small></button></div></section>
<section id="studyView" class="view"><div class="heading"><div><small id="studyMode">전체 단어</small><h2>단어 카드</h2></div><b id="cardPosition"></b></div><div class="bar"><i id="studyProgress"></i></div><article class="word-card" id="wordCard" tabindex="0"><div class="cardtop"><em id="category"></em><button id="favoriteButton" aria-label="즐겨찾기">☆</button></div><div id="emoji" class="emoji"></div><small id="part"></small><h2 id="word"></h2><button class="speak" id="wordSpeak">🔊 <span id="phonetic"></span></button><h3 id="meaning"></h3><div id="examples"></div></article><div class="controls"><button id="prev">← 이전</button><button class="primary" id="know">알아요 ✓</button><button id="next">다음 →</button></div><label class="auto"><input type="checkbox" id="autoPlay"><span></span>3초 자동 넘김</label></section>
<section id="wordsView" class="view"><div class="heading"><div><small>찾아보기</small><h2>단어장</h2></div><b id="listCount"></b></div><label class="search">🔎 <input id="search" type="search" placeholder="영어 또는 뜻 검색"></label><div class="chips" id="chips"></div><div class="word-list" id="wordList"></div></section>
<section id="quizView" class="view"><div class="heading"><div><small>실력 확인</small><h2>단어 퀴즈</h2></div><b id="quizPosition"></b></div><div class="bar"><i id="quizProgress"></i></div><article id="quizCard" class="quiz"><p>다음 단어의 뜻은?</p><h2 id="quizWord"></h2><button class="speak" id="quizSpeak">🔊 발음 듣기</button><div id="answers"></div><p id="feedback" aria-live="polite"></p><button class="primary full hidden" id="nextQuestion">다음 문제</button></article><article id="result" class="quiz hidden"><div class="trophy">🏆</div><h2>퀴즈 완료!</h2><p><b id="score"></b> / 10</p><p id="resultMessage"></p><button class="primary full" id="retry">다시 풀기</button></article></section>
</main><nav><button class="active" data-go="home">🏠<small>홈</small></button><button data-go="study">🃏<small>학습</small></button><button data-go="words">📖<small>단어장</small></button><button data-go="quiz">✅<small>퀴즈</small></button></nav><div id="toast" role="status"></div></div><script src="words.js"></script><script src="app.js"></script></body></html>
